name: Finalize panel UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply panel patch
        run: python3 scripts/finalize_panel.py
      - name: Build
        run: npm install && npm run build
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/panel/page.tsx app/globals.css
          git diff --cached --quiet || git commit -m "fix: mobile drawer and connect resident payment managers"
          git push
