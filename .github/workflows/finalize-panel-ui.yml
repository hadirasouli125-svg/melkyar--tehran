name: Finalize panel UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply panel patch
        env:
          PATCH_B64: ""
        run: echo "$PATCH_B64" | base64 -d > /tmp/patch.py && python3 /tmp/patch.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/panel/page.tsx app/globals.css
          git diff --cached --quiet || git commit -m "fix: mobile drawer and connect resident payment managers"
          git push
